<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proposal 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  background:linear-gradient(135deg,#ffd6e0,#ffe6f0);
}

/* box */
.container{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* buttons */
button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:20px;
  font-size:16px;
  cursor:pointer;
}

.yes{
  background:#ff4d6d;
  color:white;
}

.no{
  background:#999;
  color:white;
}
</style>
</head>

<body>

<div class="container">
  <h1>Hey cookie 💖<br>Will you be mine forever?</h1>
  <button class="yes" onclick="yes()">YES 💘</button>
  <button class="no" id="no">NO 💔</button>
</div>

<script>
const no = document.getElementById("no");

let moving = false;
let x = 0, y = 0;
let dx = 3, dy = 3;

// move function
function move(){
  if(!moving) return;

  x += dx;
  y += dy;

  if(x < 0 || x > window.innerWidth - 100) dx *= -1;
  if(y < 0 || y > window.innerHeight - 50) dy *= -1;

  no.style.position = "fixed";
  no.style.left = x + "px";
  no.style.top = y + "px";

  requestAnimationFrame(move);
}

// click pe start
no.addEventListener("click", (e)=>{
  e.preventDefault();

  const rect = no.getBoundingClientRect();
  x = rect.left;
  y = rect.top;

  moving = true;
  move();
});

// yes click
function yes(){
  document.body.innerHTML="<h1 style='text-align:center;margin-top:20%'>Yay 😍💍</h1>";
}
</script>

</body>
</html>
