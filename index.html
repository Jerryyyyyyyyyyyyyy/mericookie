<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate Proposal 💖</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  background:linear-gradient(135deg,#ffd6e0,#ffe6f0,#fff0f5);
}

/* CARD */
.container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:20px;
  color:#ff4d6d;
  z-index:10;
}

/* TEXT */
#text{margin-bottom:20px;font-size:22px}

/* BUTTONS */
button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

.yes{background:#ff4d6d;color:white;}
.no{background:#999;color:white;}

/* HEARTS */
.heart{
  position:absolute;
  font-size:20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-100px);}
}

/* CELEBRATION */
.celebrate{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:linear-gradient(135deg,#ff4d6d,#ff85a2,#ffd6e0);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  font-size:35px;
}
</style>
</head>

<body>

<div class="container">
  <div id="text"></div>
  <button class="yes" onclick="yes()">YES 💘</button>
  <button class="no" id="no">NO 💔</button>
</div>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b1f54.mp3">
</audio>

<script>

// ===== TYPING =====
let msg="Hey cookie 💖 Will you be mine forever?";
let i=0;
function type(){
  if(i<msg.length){
    document.getElementById("text").innerHTML+=msg[i];
    i++;
    setTimeout(type,80);
  }
}
type();

// ===== YES =====
function yes(){
  document.body.innerHTML=`
  <div class="celebrate">
    😍💍<br>YAYYYY!!<br>She said YES 💖
  </div>`;
  confetti();
}

// ===== CONFETTI =====
function confetti(){
  for(let i=0;i<120;i++){
    let c=document.createElement("div");
    c.innerHTML="✨";
    c.style.position="fixed";
    c.style.left=Math.random()*100+"%";
    c.style.top="0";
    c.style.animation="float 2s linear";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

// ===== NO BUTTON CHAOS =====
const no=document.getElementById("no");

let moving=false,x=0,y=0,dx=3,dy=3;

// move
function move(btn){
  x+=dx; y+=dy;

  if(x<0||x>window.innerWidth-100) dx*=-1;
  if(y<0||y>window.innerHeight-50) dy*=-1;

  btn.style.position="fixed";
  btn.style.left=x+"px";
  btn.style.top=y+"px";

  requestAnimationFrame(()=>move(btn));
}

// click start
no.addEventListener("click",(e)=>{
  e.preventDefault();
  const r=no.getBoundingClientRect();
  x=r.left; y=r.top;
  moving=true;
  move(no);

  spawnFakeButtons(); // 😈 clones
});

// ===== FAKE NO BUTTONS 💀 =====
function spawnFakeButtons(){
  for(let i=0;i<5;i++){
    let clone=no.cloneNode(true);
    clone.innerText="NO 😈";
    document.body.appendChild(clone);

    let cx=Math.random()*window.innerWidth;
    let cy=Math.random()*window.innerHeight;

    function run(){
      cx+=Math.random()*6-3;
      cy+=Math.random()*6-3;
      clone.style.position="fixed";
      clone.style.left=cx+"px";
      clone.style.top=cy+"px";
      requestAnimationFrame(run);
    }
    run();
  }
}

// ===== DODGE MOUSE =====
document.addEventListener("mousemove",(e)=>{
  if(moving){
    let dist=Math.hypot(e.clientX-x,e.clientY-y);
    if(dist<120){
      dx+=(x-e.clientX)/40;
      dy+=(y-e.clientY)/40;
    }
  }
});

// ===== HEARTS =====
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML=["💖","💕","💗"][Math.floor(Math.random()*3)];
  h.style.left=Math.random()*100+"%";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},200);

</script>
</body>
</html>
