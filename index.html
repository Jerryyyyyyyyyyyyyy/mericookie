<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be Mine Forever? 💖</title>
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            position: relative;
            cursor: none;
        }

        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease-out;
        }

        .loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ff6b9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== FLOATING HEARTS BACKGROUND ===== */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: #ff6b9d;
            font-size: 20px;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        /* ===== CUSTOM CURSOR WITH TRAIL ===== */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255,107,157,0.8), transparent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            mix-blend-mode: difference;
        }

        .cursor-trail {
            position: fixed;
            font-size: 16px;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.7;
            animation: trailFade 0.5s ease-out forwards;
        }

        @keyframes trailFade {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: scale(0.8);
            animation: fadeInUp 1s ease-out 0.5s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== GLASSMORPHISM CARD ===== */
        .proposal-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .proposal-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            z-index: 0;
        }

        .proposal-card:hover::before {
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        /* ===== TYPING ANIMATION TEXT ===== */
        .proposal-text {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            min-height: 80px;
            line-height: 1.3;
        }

        .typing-cursor {
            display: inline-block;
            width: 4px;
            height: 2.2rem;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ===== BUTTONS ===== */
        .buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            min-width: 140px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* YES BUTTON */
        .yes-btn {
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white;
        }

        .yes-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255,107,157,0.4);
        }

        .yes-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        /* NO BUTTON */
        .no-btn {
            background: linear-gradient(135deg, #ff9a8b, #ffafbd);
            color: white;
            transition: all 0.2s ease;
        }

        .no-btn.moving {
            position: fixed;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* ===== TEASING MESSAGES ===== */
        .tease-message {
            position: fixed;
            background: rgba(255,255,255,0.95);
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            color: #ff6b9d;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: popIn 0.4s ease-out forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* ===== CELEBRATION SCREEN ===== */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab, #ff9a9e);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        .celebration.show {
            display: flex;
            animation: celebrationFadeIn 0.8s ease-out;
        }

        @keyframes celebrationFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .celebration h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .celebration p {
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: white;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .ring-emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        /* ===== CONFETTI CANVAS ===== */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .proposal-card {
                padding: 40px 30px;
                margin: 20px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .btn {
                width: 220px;
                padding: 18px 30px;
            }
        }

        /* ===== HIDE DEFAULT CURSOR ===== */
        body * {
            cursor: none !important;
        }
    </style>
</head>
<body>
    <!-- LOADING SCREEN -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
        <div class="loading-text">Loading love...</div>
    </div>

    <!-- BACKGROUND FLOATING HEARTS -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- CUSTOM CURSOR -->
    <div class="cursor" id="cursor"></div>

    <!-- MAIN CONTENT -->
    <div class="main-container" id="mainContainer">
        <div class="proposal-card">
            <div class="card-content">
                <div class="proposal-text" id="proposalText">
                    Hey cookie, Will you be mine forever? 💖<span class="typing-cursor"></span>
                </div>
                <div class="buttons">
                    <button class="btn yes-btn" id="yesBtn">
                        YES 💘
                    </button>
                    <button class="btn no-btn" id="noBtn">
                        NO 💔
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TEASING MESSAGES -->
    <div class="tease-message" id="teaseMessage"></div>

    <!-- CELEBRATION SCREEN -->
    <div class="celebration" id="celebration">
        <div class="ring-emoji">💍✨</div>
        <h1>Yay! I knew it 😍</h1>
        <p>Forever starts now! 💖💖💖</p>
    </div>

    <!-- CONFETTI CANVAS -->
    <canvas id="confettiCanvas"></canvas>

    <!-- BACKGROUND MUSIC -->
    <audio id="bgMusic" loop>
        <!-- Note: For production, replace with actual romantic instrumental MP3 -->
        <!-- This is a silent placeholder - add your own audio file -->
    </audio>

    <!-- ROMANTIC SOUND EFFECT -->
    <audio id="successSound">
        <!-- Add your celebratory sound effect here -->
    </audio>

    <script>
        // ===== CONFIGURATION - EASY TO CUSTOMIZE =====
        const CONFIG = {
            name: 'cookie', // Change this name!
            proposalText: 'Hey cookie, Will you be mine forever?',
            teaseMessages: [
                'Are you sure? 😢',
                'Think again 😏',
                'You can\'t escape 😈',
                'Just say yes already 💖',
                'I know you want to! 🥰',
                'Pretty please? 🙏💕'
            ],
            moveSpeed: 0.3, // Initial speed for NO button
            maxSpeed: 0.8
        };

        // ===== DOM ELEMENTS =====
        const elements = {
            loadingScreen: document.getElementById('loadingScreen'),
            mainContainer: document.getElementById('mainContainer'),
            proposalText: document.getElementById('proposalText'),
            yesBtn: document.getElementById('yesBtn'),
            noBtn: document.getElementById('noBtn'),
            teaseMessage: document.getElementById('teaseMessage'),
            celebration: document.getElementById('celebration'),
            cursor: document.getElementById('cursor'),
            floatingHearts: document.getElementById('floatingHearts'),
            confettiCanvas: document.getElementById('confettiCanvas'),
            bgMusic: document.getElementById('bgMusic'),
            successSound: document.getElementById('successSound')
        };

        // ===== STATE VARIABLES =====
        let isNoButtonMoving = false;
        let currentSpeed = CONFIG.moveSpeed;
        let mouseX = 0;
        let mouseY = 0;
        let trailHearts = [];
        let confettiParticles = [];
        let animationId;

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', function() {
            init();
        });

        function init() {
            // Start loading sequence
            setTimeout(() => {
                fadeOutLoading();
            }, 2000);

            // Initialize effects
            createFloatingHearts();
            setupCursor();
            setupTypingAnimation();
            setupEventListeners();
            // startBackgroundMusic(); // Uncomment when you have audio file
        }

        // ===== LOADING SCREEN =====
        function fadeOutLoading() {
            elements.loadingScreen.classList.add('fade-out');
            setTimeout(() => {
                elements.loadingScreen.style.display = 'none';
            }, 800);
        }

        // ===== FLOATING HEARTS BACKGROUND =====
        function createFloatingHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    createHeart();
                }, i * 200);
            }
            setInterval(createHeart, 2000);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['💖', '💕', '💗', '💝'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            elements.floatingHearts.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        // ===== CUSTOM CURSOR WITH TRAIL =====
        function setupCursor() {
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                elements.cursor.style.left = mouseX + 'px';
                elements.cursor.style.top = mouseY + 'px';
                elements.cursor.style.transform = `translate(-50%, -50%) scale(${1 + Math.sin(Date.now() / 200) * 0.2})`;

                // Create trail hearts
                if (Math.random() < 0.3) {
                    createTrailHeart();
                }
            });
        }

        function createTrailHeart() {
            const trailHeart = document.createElement('div');
            trailHeart.className = 'cursor-trail';
            trailHeart.innerHTML = ['💖', '💕'][Math.floor(Math.random() * 2)];
            trailHeart.style.left = mouseX + 'px';
            trailHeart.style.top = mouseY + 'px';
            document.body.appendChild(trailHeart);

            setTimeout(() => {
                trailHeart.remove();
            }, 500);
        }

        // ===== TYPING ANIMATION =====
        function setupTypingAnimation() {
            const fullText = CONFIG.proposalText;
            const textEl = elements.proposalText;
            let i = 0;

            function typeWriter() {
                if (i < fullText.length) {
                    textEl.innerHTML = fullText.slice(0, i + 1) + '<span class="typing-cursor"></span>';
                    i++;
                    setTimeout(typeWriter, 100);
                } else {
                    textEl.innerHTML = fullText + ' ';
                    setTimeout(() => {
                        textEl.querySelector('.typing-cursor')?.remove();
                    }, 500);
                }
            }

            setTimeout(typeWriter, 1000);
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // YES BUTTON - CELEBRATION
            elements.yesBtn.addEventListener('click', handleYesClick);

            // NO BUTTON - MOVING MAGIC
            elements.noBtn.addEventListener('mouseenter', handleNoHover);
            elements.noBtn.addEventListener('mouseleave', handleNoLeave);
            elements.noBtn.addEventListener('click', handleNoClick);
        }

        // ===== YES BUTTON HANDLER =====
        function handleYesClick() {
            // Stop all interactions
            elements.mainContainer.style.pointerEvents = 'none';
            
            // Show celebration
            elements.celebration.classList.add('show');
            
            // Trigger effects
            createConfetti();
            createHeartsExplosion();
            playSuccessSound();
            
            // Hide buttons
            elements.yesBtn.style.opacity = '0';
            elements.noBtn.style.opacity = '0';
        }

        // ===== NO BUTTON HANDLERS =====
        function handleNoHover() {
            if (!isNoButtonMoving) {
                startNoButtonChase();
            }
        }

        function handleNoLeave() {
            // Button keeps moving once started
        }

        function handleNoClick(e) {
            e.preventDefault();
            showRandomTeaseMessage();
            moveNoButton();
        }

        // ===== NO BUTTON CHASE MECHANIC =====
        function startNoButtonChase() {
            isNoButtonMoving = true;
            elements.noBtn.classList.add('moving');
            moveNoButton();
        }

        function moveNoButton() {
            const rect = elements.noBtn.getBoundingClientRect();
            const buttonCenterX = rect.left + rect.width / 2;
            const buttonCenterY = rect.top + rect.height / 2;
            const mouseCenterX = mouseX;
            const mouseCenterY = mouseY;

            // Calculate new position away from mouse
            let newX, newY;
            const distance = 150;
            const angle = Math.atan2(mouseCenterY - buttonCenterY, mouseCenterX - buttonCenterX);
            
            newX = Math.cos(angle + Math.PI) * distance + window.innerWidth / 2;
            newY = Math.sin(angle + Math.PI) * distance + window.innerHeight / 2;

            // Keep within bounds
            newX = Math.max(50, Math.min(newX, window.innerWidth - 150));
            newY = Math.max(50, Math.min(newY, window.innerHeight - 100));

            elements.noBtn.style.left = newX + 'px';
            elements.noBtn.style.top = newY + 'px';
            elements.noBtn.style.transitionDuration = currentSpeed + 's';

            // Increase speed slightly
            currentSpeed = Math.min(currentSpeed + 0.02, CONFIG.maxSpeed);

            // Continue chase
            setTimeout(moveNoButton, 200);
        }

        // ===== TEASING MESSAGES =====
        function showRandomTeaseMessage() {
            const message = CONFIG.teaseMessages[Math.floor(Math.random() * CONFIG.teaseMessages.length)];
            elements.teaseMessage.textContent = message;
            elements.teaseMessage.classList.add('show');

            setTimeout(() => {
                elements.teaseMessage.classList.remove('show');
            }, 2000);
        }

        // ===== CONFETTI ANIMATION =====
        function createConfetti() {
            const canvas = elements.confettiCanvas;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            confettiParticles = [];

            for (let i = 0; i < 100; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    vx: (Math.random() - 0.5) * 10,
                    vy: Math.random() * 5 + 5,
                    size: Math.random() * 8 + 4,
                    color: ['#ff6b9d', '#ff8fab', '#ff9a9e', '#fecfef'][Math.floor(Math.random() * 4)],
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10
                });
            }

            animateConfetti(ctx);
        }

        function animateConfetti(ctx) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            confettiParticles.forEach((particle, index) => {
                ctx.save();
                ctx.translate(particle.x, particle.y);
                ctx.rotate(particle.rotation * Math.PI / 180);
                ctx.fillStyle = particle.color;
                ctx.fillRect(-particle.size/2, -particle.size/2, particle.size, particle.size);
                ctx.restore();

                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy *= 0.99;
                particle.rotation += particle.rotSpeed;

                if (particle.y > ctx.canvas.height) {
                    confettiParticles.splice(index, 1);
                }
            });

            if (confettiParticles.length > 0) {
                requestAnimationFrame(() => animateConfetti(ctx));
            }
        }

        // ===== HEARTS EXPLOSION =====
        function createHeartsExplosion() {
            const hearts = ['💖', '💕', '💗', '💝', '✨'];
            const container = document.createElement('div');
            container.className = 'hearts-explosion';
            document.body.appendChild(container);

            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.className = 'explosion-heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = '50%';
                heart.style.top = '50%';
                
                const angle = (Math.PI * 2 * i) / 30;
                const velocity = 200 + Math.random() * 100;
                heart.style.setProperty('--vx', Math.cos(angle) * velocity + 'px');
                heart.style.setProperty('--vy', Math.sin(angle) * velocity + 'px');
                
                container.appendChild(heart);

                setTimeout(() => heart.remove(), 1000);
            }

            setTimeout(() => container.remove(), 1000);
        }

        // ===== AUDIO FUNCTIONS =====
        function startBackgroundMusic() {
            elements.bgMusic.volume = 0.1;
            elements.bgMusic.play().catch(e => console.log('Autoplay prevented'));
        }

        function playSuccessSound() {
            elements.successSound.currentTime = 0;
            elements.successSound.volume = 0.3;
            elements.successSound.play().catch(e => console.log('Sound play failed'));
        }

        // ===== WINDOW RESIZE HANDLER =====
        window.addEventListener('resize', () => {
            elements.confettiCanvas.width = window.innerWidth;
            elements.confettiCanvas.height = window.innerHeight;
        });

        // ===== CSS FOR HEARTS EXPLOSION (DYNAMIC) =====
        const style = document.createElement('style');
        style.textContent = `
            .explosion-heart {
                position: absolute;
                font-size: 24px;
                pointer-events: none;
                animation: explode 1s ease-out forwards;
            }
            @keyframes explode {
                0% {
                    transform: translate(0, 0) scale(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translate(var(--vx), var(--vy)) scale(1) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
